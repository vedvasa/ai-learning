# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

services:
  - type: web
    name: ai-learning-promptbench
    runtime: python
    plan: free
    region: oregon
    buildCommand: uv sync --locked --no-dev --no-editable
    startCommand: ./scripts/start-production.sh
    healthCheckPath: /health/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: UV_VERSION
        value: 0.12.3
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_TIMEOUT_SECONDS
        value: "30"
      - key: LLM_MAX_ATTEMPTS
        value: "3"
      - key: LLM_RETRY_BASE_DELAY_SECONDS
        value: "0.25"
      - key: LLM_RETRY_MAX_DELAY_SECONDS
        value: "2"
      - key: LLM_RETRY_JITTER_RATIO
        value: "0.25"
      - key: LLM_MAX_OUTPUT_TOKENS
        value: "64"
      - key: TRIAGE_MAX_OUTPUT_TOKENS
        value: "256"
      - key: MAX_MODEL_COST_USD_PER_REQUEST
        value: "0.05"
      - key: USAGE_RECORDER_CAPACITY
        value: "1000"
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5-20251001
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
