name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Install the locked project
        run: uv sync --locked --no-editable

      - name: Run tests
        run: uv run --no-sync pytest -v

      - name: Check production startup script
        run: |
          sh -n scripts/start-production.sh
          sh -n scripts/start-container.sh
          sh -n scripts/smoke-container.sh

      - name: Verify production dependency installation
        run: |
          uv sync --locked --no-dev --no-editable
          uv run --no-sync python -c \
            "from app.main import app; assert app.title == 'KnowledgeDesk'"

      - name: Build production container
        run: docker build --tag ai-learning:ci .

      - name: Smoke-test production container
        run: sh scripts/smoke-container.sh ai-learning:ci
