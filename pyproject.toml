[project]
name = "ai-learning"
version = "0.1.0"
description = "Project-based curriculum and applications for learning production AI engineering"
readme = "README.md"
authors = [
    { name = "vedvasa", email = "vedvasa@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.121.0",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "openai>=2.0.0",
    "pydantic-settings>=2.15.0",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
ai-learning = "ai_learning:main"
anthropic-check = "ai_learning.anthropic_check:main"
openai-check = "ai_learning.openai_check:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
